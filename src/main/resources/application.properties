spring.application.name=promaco-backend
server.port=8080

# =========================================================
# BASE DE DATOS: PostgreSQL en AWS EC2
# Cambia IP_DE_TU_EC2 por la "Public IPv4 address" de tu instancia.
# (Ojo: en AWS Academy la IP cambia cada vez que reinicias el lab.)
# =========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://IP_DE_TU_EC2:5432/promaco_db}
spring.datasource.username=${DB_USER:promaco_user}
spring.datasource.password=${DB_PASSWORD:Promaco2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Pool de conexiones
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# =========================================================
# JWT
# La clave debe estar en Base64 y tener al menos 256 bits.
# En un entorno real se pasa como variable de entorno JWT_SECRET.
# =========================================================
app.jwt.secret=${JWT_SECRET:UHJvbWFjby1TcEEtY2xhdmUtc2VjcmV0YS1wYXJhLWZpcm1hci1sb3MtdG9rZW5zLUpXVC0yMDI2}
# Duración del token: 2 horas (en milisegundos)
app.jwt.expiration-ms=7200000

# Orígenes que pueden llamar a la API (el frontend de Vite)
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
