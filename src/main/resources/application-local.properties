# =========================================================
# PERFIL "local" (RESPALDO)
# Usa una base H2 guardada en un archivo dentro del proyecto,
# por si la instancia EC2 no está disponible el día de la presentación.
# Se activa con:  mvn spring-boot:run -Dspring-boot.run.profiles=local
# =========================================================
spring.datasource.url=jdbc:h2:file:./data/promaco_db;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

